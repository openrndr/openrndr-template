name: Build on commit
on:
  push:
    branches:
      - master
      - next-version
      - snapshot
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          #cache: 'gradle'

      - name: Build sources
        run: ./gradlew build

